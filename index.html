<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluesky Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e12;
  --card: #151619;
  --card2: #1c1d22;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --accent: #7c6cfc;
  --accent-bg: rgba(124,108,252,0.1);
  --accent-border: rgba(124,108,252,0.35);
  --text: #e2e3ea;
  --muted: #555762;
  --muted2: #8b8e9e;
  --green: #34d399;
  --red: #f87171;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(13,14,18,0.9);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 50;
}

.logo { display: flex; align-items: center; gap: 9px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 2.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.logo-text { font-size: 13px; font-family: var(--mono); letter-spacing: .06em; }

#badge {
  font-size: 11px;
  font-family: var(--mono);
  padding: 4px 11px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  color: var(--muted2);
}
#badge.on { border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent); }

.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 24px 16px 60px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
}

.card-head {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-label {
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: .1em;
  color: var(--muted2);
  text-transform: uppercase;
}

.card-head.toggle { cursor: pointer; user-select: none; }
.arrow { font-size: 10px; color: var(--muted); transition: transform .2s; }
.arrow.open { transform: rotate(90deg); }

.card-body { padding: 16px; }
.collapsed { display: none; }

.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }

label {
  display: block;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--muted2);
  margin-bottom: 6px;
  letter-spacing: .05em;
}

.opt {
  display: inline-block;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--card2);
  color: var(--muted);
  margin-left: 5px;
  vertical-align: middle;
}

input[type=text], input[type=password], textarea {
  width: 100%;
  background: var(--card2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 14px;
  font-family: var(--sans);
  color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
textarea { resize: vertical; min-height: 72px; line-height: 1.55; }
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

/* CATEGORY PILLS */
.cats { display: flex; flex-wrap: wrap; gap: 7px; }
.cat {
  padding: 6px 13px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: transparent;
  font-size: 13px;
  color: var(--muted2);
  cursor: pointer;
  transition: all .15s;
  font-family: var(--sans);
}
.cat:hover { background: var(--card2); color: var(--text); }
.cat.active { border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent); }

/* PHOTO */
.photo-drop {
  border: 1.5px dashed var(--border2);
  border-radius: 10px;
  padding: 22px;
  text-align: center;
  cursor: pointer;
  transition: all .15s;
  position: relative;
}
.photo-drop:hover, .photo-drop.over { border-color: var(--accent); background: var(--accent-bg); }
.photo-drop input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
  width: 100%; height: 100%; border: none; background: none; padding: 0;
}
.photo-drop p { font-size: 13px; color: var(--muted2); pointer-events: none; }
.photo-drop small { font-size: 11px; color: var(--muted); pointer-events: none; }

.photo-preview {
  display: none;
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border2);
}
.photo-preview img { width: 100%; height: 160px; object-fit: cover; display: block; }
.photo-remove {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,0,0,.65); border: none; border-radius: 99px;
  width: 26px; height: 26px; color: #fff; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background .15s;
}
.photo-remove:hover { background: var(--red); }
.photo-err { font-size: 11px; color: var(--red); margin-top: 5px; display: none; }

/* PREVIEW */
.preview-box {
  background: var(--card2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 13px 14px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 50px;
}
.preview-empty { color: var(--muted); font-style: italic; font-size: 13px; }
.char-row { display: flex; justify-content: flex-end; margin-top: 6px; }
.char { font-size: 11px; font-family: var(--mono); color: var(--muted); }
.char.warn { color: #f59e0b; }
.char.over { color: var(--red); }

/* CREDS */
.creds-pw { position: relative; }
.creds-pw input { padding-right: 38px; }
.eye-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
.eye-btn:hover { color: var(--muted2); }
.notice { background: rgba(124,108,252,.06); border: 1px solid rgba(124,108,252,.18); border-radius: 8px; padding: 10px 13px; font-size: 11.5px; font-family: var(--mono); color: #9d94fc; line-height: 1.6; margin-bottom: 13px; }
.creds-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.btn-sm { padding: 7px 15px; border-radius: 8px; font-size: 12px; font-family: var(--mono); cursor: pointer; border: none; transition: all .15s; }
.btn-save { background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent); }
.btn-save:hover { background: rgba(124,108,252,.18); }
.btn-del { background: transparent; border: 1px solid rgba(248,113,113,.25); color: var(--red); }
.btn-del:hover { background: rgba(248,113,113,.08); }

/* POST BUTTON */
.post-btn {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--r);
  font-size: 15px;
  font-family: var(--sans);
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}
.post-btn:hover:not(:disabled) { background: #9282ff; transform: translateY(-1px); }
.post-btn:active:not(:disabled) { transform: translateY(0); }
.post-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; display: none; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* HISTORY */
.history-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  animation: fadeUp .25s ease;
}
.history-item:last-child { border-bottom: none; }
@keyframes fadeUp { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

.hi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.hi-cat { font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 99px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); white-space: nowrap; }
.hi-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 2px; }
.hi-del:hover { color: var(--red); }
.hi-name { font-size: 14px; font-weight: 500; }
.hi-note { font-size: 12.5px; color: var(--muted2); margin-top: 3px; }
.hi-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; }
.hi-time { font-size: 10.5px; font-family: var(--mono); color: var(--muted); }
.hi-link { font-size: 11px; font-family: var(--mono); color: var(--accent); text-decoration: none; }
.hi-link:hover { text-decoration: underline; }
.empty { text-align: center; padding: 28px; font-size: 13px; font-family: var(--mono); color: var(--muted); }
.clear-btn { background: none; border: none; font-size: 11px; font-family: var(--mono); color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 5px; }
.clear-btn:hover { color: var(--red); }

/* TOAST */
#toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--card2); border: 1px solid var(--border2);
  border-radius: 99px; padding: 10px 18px;
  font-size: 13px; font-family: var(--mono); color: var(--text);
  transition: transform .25s cubic-bezier(.4,0,.2,1), opacity .25s;
  opacity: 0; pointer-events: none; z-index: 999; white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
#toast.ok { color: var(--green); border-color: rgba(52,211,153,.3); }
#toast.err { color: var(--red); border-color: rgba(248,113,113,.3); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="dot"></div>
    <span class="logo-text">tracker room</span>
  </div>
  <div id="badge">not connected</div>
</header>

<div class="wrap">

  <!-- AKUN -->
  <div class="card">
    <div class="card-head toggle" onclick="toggleCard('creds')">
      <span class="card-label">Akun Bluesky</span>
      <span id="creds-arrow" class="arrow">▶</span>
    </div>
    <div id="creds-body" class="card-body collapsed">
      <div class="notice">Pakai <strong>App Password</strong>, bukan password utama.<br>Settings → Privacy &amp; Security → App Passwords</div>
      <div class="field">
        <label>Handle</label>
        <input type="text" id="handle" placeholder="nama.bsky.social" />
      </div>
      <div class="field">
        <label>App Password</label>
        <div class="creds-pw">
          <input type="password" id="apppass" placeholder="xxxx-xxxx-xxxx-xxxx" />
          <button class="eye-btn" onclick="toggleEye()">👁</button>
        </div>
      </div>
      <div class="creds-row">
        <button class="btn-sm btn-del" onclick="clearCreds()">Hapus</button>
        <button class="btn-sm btn-save" onclick="saveCreds()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- FORM -->
  <div class="card">
    <div class="card-head"><span class="card-label">Log Baru</span></div>
    <div class="card-body">

      <div class="field">
        <label>Kategori</label>
        <div class="cats">
          <button class="cat" data-val="📖 Manga" onclick="pickCat(this)">📖 Manga</button>
          <button class="cat" data-val="📗 Manhwa" onclick="pickCat(this)">📗 Manhwa</button>
          <button class="cat" data-val="📚 Novel" onclick="pickCat(this)">📚 Novel</button>
          <button class="cat" data-val="🎌 Anime" onclick="pickCat(this)">🎌 Anime</button>
          <button class="cat" data-val="🎬 Film" onclick="pickCat(this)">🎬 Film</button>
          <button class="cat" data-val="🎵 Music" onclick="pickCat(this)">🎵 Music</button>
          <button class="cat" data-val="🔞 NSFW" onclick="pickCat(this)">🔞 NSFW</button>
        </div>
      </div>

      <div class="field">
        <label>Nama / Judul</label>
        <input type="text" id="nama" placeholder="Contoh: Attack on Titan Season 4" oninput="buildPreview()" />
      </div>

      <div class="field">
        <label>Catatan <span class="opt">opsional</span></label>
        <textarea id="catatan" placeholder="Kesan singkat, review, atau quotes..." oninput="buildPreview()"></textarea>
      </div>

      <div class="field">
        <label>Foto <span class="opt">opsional</span></label>
        <div id="dropZone" class="photo-drop"
          ondragover="event.preventDefault();this.classList.add('over')"
          ondragleave="this.classList.remove('over')"
          ondrop="handleDrop(event)">
          <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(this.files[0])" />
          <p>Klik atau drag foto ke sini</p>
          <small>JPG · PNG · WEBP &nbsp;·&nbsp; Maks 1 MB</small>
        </div>
        <div id="photoPreview" class="photo-preview">
          <img id="photoImg" src="" alt="" />
          <button class="photo-remove" onclick="removePhoto()">✕</button>
        </div>
        <p id="photoErr" class="photo-err"></p>
      </div>

    </div>
  </div>

  <!-- PREVIEW -->
  <div class="card">
    <div class="card-head"><span class="card-label">Preview Post</span></div>
    <div class="card-body" style="padding-bottom:12px;">
      <div id="previewBox" class="preview-box"><span class="preview-empty">Isi form untuk melihat preview...</span></div>
      <div class="char-row"><span id="charCount" class="char">0 / 300</span></div>
    </div>
  </div>

  <button class="post-btn" id="postBtn" onclick="doPost()">
    <div class="spinner" id="spinner"></div>
    <span id="postLabel">Post ke Bluesky</span>
  </button>

  <!-- HISTORY -->
  <div class="card">
    <div class="card-head">
      <span class="card-label">Riwayat</span>
      <button class="clear-btn" onclick="clearHistory()">Hapus semua</button>
    </div>
    <div id="histList"></div>
  </div>

</div>

<div id="toast"></div>

<script>
let selCat = '';
let photoFile = null;
let busy = false;

addEventListener('DOMContentLoaded', () => {
  document.getElementById('handle').value = localStorage.getItem('bsky_handle') || '';
  document.getElementById('apppass').value = localStorage.getItem('bsky_apppass') || '';
  updateBadge();
  renderHistory();
  if (!localStorage.getItem('bsky_handle')) openCard('creds');
});

function toggleCard(id) {
  document.getElementById(id+'-body').classList.toggle('collapsed');
  document.getElementById(id+'-arrow').classList.toggle('open');
}
function openCard(id) {
  document.getElementById(id+'-body').classList.remove('collapsed');
  document.getElementById(id+'-arrow').classList.add('open');
}

/* CREDS */
function saveCreds() {
  let h = document.getElementById('handle').value.trim().replace(/^@/,'');
  const p = document.getElementById('apppass').value.trim();
  if (!h || !p) { toast('Lengkapi handle dan app password', 'err'); return; }
  localStorage.setItem('bsky_handle', h);
  localStorage.setItem('bsky_apppass', p);
  updateBadge(); toast('Tersimpan ✓', 'ok'); toggleCard('creds');
}
function clearCreds() {
  if (!confirm('Hapus kredensial?')) return;
  localStorage.removeItem('bsky_handle'); localStorage.removeItem('bsky_apppass');
  document.getElementById('handle').value = ''; document.getElementById('apppass').value = '';
  updateBadge(); toast('Dihapus', 'err');
}
function toggleEye() {
  const el = document.getElementById('apppass');
  el.type = el.type === 'password' ? 'text' : 'password';
}
function updateBadge() {
  const h = localStorage.getItem('bsky_handle');
  const b = document.getElementById('badge');
  if (h) { b.textContent = '@' + h; b.className = 'on'; }
  else { b.textContent = 'not connected'; b.className = ''; }
}

/* CATEGORY */
function pickCat(btn) {
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); selCat = btn.dataset.val; buildPreview();
}

/* PHOTO */
function handleDrop(e) {
  e.preventDefault(); document.getElementById('dropZone').classList.remove('over');
  if (e.dataTransfer.files[0]) handlePhoto(e.dataTransfer.files[0]);
}
function handlePhoto(f) {
  const err = document.getElementById('photoErr');
  err.style.display = 'none';
  if (!f) return;
  if (!f.type.startsWith('image/')) { err.textContent = 'File harus berupa gambar.'; err.style.display = 'block'; return; }
  if (f.size > 1000000) { err.textContent = 'Ukuran maksimal 1 MB.'; err.style.display = 'block'; return; }
  photoFile = f;
  const r = new FileReader();
  r.onload = e => {
    document.getElementById('photoImg').src = e.target.result;
    document.getElementById('dropZone').style.display = 'none';
    document.getElementById('photoPreview').style.display = 'block';
  };
  r.readAsDataURL(f);
}
function removePhoto() {
  photoFile = null;
  document.getElementById('photoImg').src = '';
  document.getElementById('photoInput').value = '';
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
}

/* PREVIEW */
function buildPreview() {
  const nama = document.getElementById('nama').value.trim();
  const catatan = document.getElementById('catatan').value.trim();
  const box = document.getElementById('previewBox');
  const charEl = document.getElementById('charCount');

  if (!selCat && !nama) {
    box.innerHTML = '<span class="preview-empty">Isi form untuk melihat preview...</span>';
    charEl.textContent = '0 / 300'; charEl.className = 'char'; return;
  }

  const parts = [];
  if (selCat) parts.push(selCat);
  if (nama) parts.push(nama);
  if (catatan) parts.push('\n' + catatan);
  const text = parts.join('\n');
  box.textContent = text;

  const len = [...text].length;
  charEl.textContent = len + ' / 300';
  charEl.className = 'char' + (len > 300 ? ' over' : len > 260 ? ' warn' : '');
}

/* POST */
async function doPost() {
  if (busy) return;
  const nama = document.getElementById('nama').value.trim();
  const catatan = document.getElementById('catatan').value.trim();
  if (!selCat) { toast('Pilih kategori dulu!', 'err'); return; }
  if (!nama) { toast('Isi nama / judul dulu!', 'err'); return; }

  const parts = [selCat, nama];
  if (catatan) parts.push('\n' + catatan);
  const text = parts.join('\n');
  if ([...text].length > 300) { toast('Teks melebihi 300 karakter!', 'err'); return; }

  let handle = (localStorage.getItem('bsky_handle') || document.getElementById('handle').value.trim()).replace(/^@/,'');
  let pass = localStorage.getItem('bsky_apppass') || document.getElementById('apppass').value.trim();
  if (!handle || !pass) { toast('Lengkapi akun Bluesky dulu!', 'err'); openCard('creds'); return; }

  setBusy(true);
  try {
    const sRes = await fetch('https://bsky.social/xrpc/com.atproto.server.createSession', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ identifier: handle, password: pass })
    });
    if (!sRes.ok) { const e = await sRes.json().catch(()=>({})); throw new Error(e.message || 'Login gagal. Cek handle & app password.'); }
    const { accessJwt, did } = await sRes.json();

    let embed = null;
    if (photoFile) {
      const buf = await photoFile.arrayBuffer();
      const bRes = await fetch('https://bsky.social/xrpc/com.atproto.repo.uploadBlob', {
        method: 'POST', headers: {'Content-Type': photoFile.type, 'Authorization': 'Bearer ' + accessJwt },
        body: buf
      });
      if (!bRes.ok) throw new Error('Gagal upload foto.');
      const { blob } = await bRes.json();
      embed = { $type: 'app.bsky.embed.images', images: [{ image: blob, alt: nama }] };
    }

    const record = { $type: 'app.bsky.feed.post', text, createdAt: new Date().toISOString(), langs: ['id'] };
    if (embed) record.embed = embed;

    const pRes = await fetch('https://bsky.social/xrpc/com.atproto.repo.createRecord', {
      method: 'POST', headers: {'Content-Type':'application/json', 'Authorization': 'Bearer ' + accessJwt },
      body: JSON.stringify({ repo: did, collection: 'app.bsky.feed.post', record })
    });
    if (!pRes.ok) { const e = await pRes.json().catch(()=>({})); throw new Error(e.message || 'Gagal posting.'); }
    const { uri } = await pRes.json();
    const rkey = uri?.split('/').pop();
    const url = rkey ? 'https://bsky.app/profile/' + handle + '/post/' + rkey : null;

    addHist({ cat: selCat, nama, catatan, url, ts: Date.now() });
    resetForm(); toast('Berhasil dipost! 🎉', 'ok');
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    setBusy(false);
  }
}

function resetForm() {
  document.getElementById('nama').value = '';
  document.getElementById('catatan').value = '';
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
  selCat = ''; removePhoto(); buildPreview();
}

function setBusy(v) {
  busy = v;
  document.getElementById('postBtn').disabled = v;
  document.getElementById('spinner').style.display = v ? 'block' : 'none';
  document.getElementById('postLabel').textContent = v ? 'Mengirim...' : 'Post ke Bluesky';
}

/* HISTORY */
function getHist() { try { return JSON.parse(localStorage.getItem('bsky_hist') || '[]'); } catch { return []; } }
function saveHist(a) { localStorage.setItem('bsky_hist', JSON.stringify(a)); }
function addHist(item) { const a = getHist(); a.unshift(item); if (a.length > 60) a.pop(); saveHist(a); renderHistory(); }
function delHist(i) { const a = getHist(); a.splice(i, 1); saveHist(a); renderHistory(); }
function clearHistory() { if (!confirm('Hapus semua riwayat?')) return; saveHist([]); renderHistory(); }

function renderHistory() {
  const a = getHist();
  const el = document.getElementById('histList');
  if (!a.length) { el.innerHTML = '<div class="empty">Belum ada riwayat.</div>'; return; }
  el.innerHTML = a.map((item, i) => {
    const d = new Date(item.ts);
    const time = d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    return `<div class="history-item">
      <div class="hi-top">
        <span class="hi-cat">${x(item.cat)}</span>
        <button class="hi-del" onclick="delHist(${i})">✕</button>
      </div>
      <div class="hi-name">${x(item.nama)}</div>
      ${item.catatan ? `<div class="hi-note">${x(item.catatan)}</div>` : ''}
      <div class="hi-footer">
        <span class="hi-time">${time}</span>
        ${item.url ? `<a class="hi-link" href="${item.url}" target="_blank" rel="noopener">Lihat ↗</a>` : ''}
      </div>
    </div>`;
  }).join('');
}

function x(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* TOAST */
let tt;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + (type||'');
  clearTimeout(tt); tt = setTimeout(() => { el.className = ''; }, 2800);
}
</script>
</body>
</html>
